[package]
name = "woodforge-wasm-bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
woodforge-core = { path = "../core" }
woodforge-renderer = { path = "../renderer" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde_json = "1"
glam = "0.29"
wgpu = "24"
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "HtmlCanvasElement",
    "Window",
    "Document",
    "Element",
    "GpuCanvasContext",
]
