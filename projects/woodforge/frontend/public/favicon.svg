<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#1a1a2e" stroke="#e94560" stroke-width="2"/>
  <!-- Wood plank (horizontal board) -->
  <rect x="12" y="24" width="40" height="16" rx="2" fill="#8B6914" stroke="#6B4F12" stroke-width="1"/>
  <!-- Wood grain lines -->
  <line x1="14" y1="28" x2="50" y2="28" stroke="#7A5C10" stroke-width="0.8" opacity="0.6"/>
  <line x1="14" y1="32" x2="50" y2="32" stroke="#7A5C10" stroke-width="0.8" opacity="0.6"/>
  <line x1="14" y1="36" x2="50" y2="36" stroke="#7A5C10" stroke-width="0.8" opacity="0.6"/>
  <!-- Saw blade (circular saw) -->
  <circle cx="44" cy="18" r="10" fill="none" stroke="#e94560" stroke-width="2"/>
  <circle cx="44" cy="18" r="3" fill="#e94560"/>
  <!-- Saw teeth (simplified) -->
  <path d="M44 8 L45.5 10 L42.5 10 Z" fill="#e94560"/>
  <path d="M54 18 L52 19.5 L52 16.5 Z" fill="#e94560"/>
  <path d="M44 28 L42.5 26 L45.5 26 Z" fill="#e94560"/>
  <path d="M34 18 L36 16.5 L36 19.5 Z" fill="#e94560"/>
  <!-- Diagonal teeth -->
  <path d="M51 11 L49.5 13 L52 12.5 Z" fill="#e94560"/>
  <path d="M51 25 L52 22.5 L49.5 23 Z" fill="#e94560"/>
  <path d="M37 25 L38.5 23 L36 23.5 Z" fill="#e94560"/>
  <path d="M37 11 L36 13.5 L38.5 13 Z" fill="#e94560"/>
  <!-- Forge spark accents -->
  <circle cx="16" cy="16" r="1.5" fill="#e94560" opacity="0.8"/>
  <circle cx="20" cy="12" r="1" fill="#e94560" opacity="0.6"/>
  <circle cx="13" cy="20" r="1" fill="#e94560" opacity="0.5"/>
</svg>
